buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://maven.minecraftforge.net/" }
    }

    dependencies {
        classpath('com.anatawa12.forge:ForgeGradle:1.2-1.1.1') {
            changing = true
        }
    }
}

apply plugin: 'forge'

version = "2.3.1"
group = "com.zergatul.freecam"
archivesBaseName = "zergatul.freecam-forge-1.7.10"
def releaseJarName = "zergatul.freecam-${version}-forge-1.7.10.jar"

def mixinConfig = "mixins.freecam.json"
def mixinRefmap = "mixins.freecam.refmap.json"
def mixinSrg = file("$buildDir/tmp/reobf/mixins.srg")
def reobfInputDir = file("$buildDir/reobfInput")

sourceCompatibility = 1.8
targetCompatibility = 1.8

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"
    mappings = "stable_12"
}

repositories {
    maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
    mavenCentral()
}

configurations {
    shade
    mixinProcessor
    compile.extendsFrom(shade)
}

dependencies {
    shade('org.spongepowered:mixin:0.7.11-SNAPSHOT') {
        exclude module: 'launchwrapper'
        exclude module: 'guava'
        exclude module: 'gson'
        exclude module: 'commons-io'
        exclude module: 'log4j-core'
    }
    mixinProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// MixinGradle does not support ForgeGradle 1.2. Wire its annotation processors
// directly to ForgeGradle's SRG input and feed the generated SRG back to reobf.
compileJava {
    options.annotationProcessorPath = configurations.mixinProcessor
    options.compilerArgs += [
            '-processor',
            'org.spongepowered.tools.obfuscation.MixinObfuscationProcessorInjection,org.spongepowered.tools.obfuscation.MixinObfuscationProcessorTargets',
            "-AreobfSrgFile=${tasks.reobf.srg}",
            "-AoutSrgFile=${mixinSrg}",
            "-AoutRefMapFile=${new File(destinationDir, mixinRefmap)}"
    ]

    doFirst {
        mixinSrg.parentFile.mkdirs()
        destinationDir.mkdirs()
    }
}

reobf {
    addExtraSrgFile mixinSrg
}

def mixinManifestAttributes = [
        'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
        'TweakOrder': '0',
        'MixinConfigs': mixinConfig,
        'FMLCorePlugin': 'com.zergatul.freecam.FMLTweaker',
        'FMLCorePluginContainsFMLMod': 'true',
        'ForceLoadAsMod': 'true']

jar {
    archiveName = releaseJarName

    // ForgeGradle 1.2 reobfuscates this archive in place. Keep that mutable
    // intermediate out of build/libs so a later `jar` invocation cannot
    // silently replace the distributable release with an MCP-named jar.
    destinationDir = reobfInputDir

    from {
        configurations.shade.collect { dependency ->
            dependency.isDirectory() ? dependency : zipTree(dependency)
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'

    manifest.attributes(mixinManifestAttributes)
}

task releaseJar(type: Copy, dependsOn: reobf) {
    group = 'build'
    description = 'Copies the reobfuscated distributable jar to build/libs.'
    from { jar.archivePath }
    into "$buildDir/libs"
}

assemble.dependsOn releaseJar

// ForgeGradle adds the packaged mod jar to development runs. Once that jar is
// also a coremod, FML treats it as a command-line library and skips @Mod
// discovery. Use one merged class/resource directory for dev and IDEA instead,
// and load the coremod explicitly from that directory.
task prepareRunMod(type: Sync, dependsOn: classes) {
    from sourceSets.main.output
    into "$buildDir/runMod"
}

task packagedDevelopmentJar(type: Jar, dependsOn: classes) {
    archiveName = "${archivesBaseName}-${version}-dev-runtime.jar"
    destinationDir = file("$buildDir/packagedTestInput")
    from sourceSets.main.output
    from {
        configurations.shade.collect { dependency ->
            dependency.isDirectory() ? dependency : zipTree(dependency)
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    manifest.attributes(mixinManifestAttributes)
}

task preparePackagedClient(type: Sync, dependsOn: packagedDevelopmentJar) {
    from { packagedDevelopmentJar.archivePath }
    into "$buildDir/packagedRun/mods"
}

task runPackagedClient(type: JavaExec, dependsOn: preparePackagedClient) {
    group = 'ForgeGradle'
    description = 'Runs a packaged development jar with its shaded Mixin runtime.'
    standardOutput = System.out
    errorOutput = System.err
}

afterEvaluate {
    [runClient, debugClient].each { runTask ->
        File packagedMod = jar.archivePath.canonicalFile
        runTask.classpath = files(
                prepareRunMod.destinationDir,
                runTask.classpath.filter { it.canonicalFile != packagedMod })
        runTask.jvmArgs '-Dfml.coreMods.load=com.zergatul.freecam.FMLTweaker'
        runTask.dependsOn prepareRunMod
        runTask.outputs.upToDateWhen { false }
    }

    Set<File> shadedDependencies = configurations.shade.files.collect { it.canonicalFile } as Set
    File developmentOutput = prepareRunMod.destinationDir.canonicalFile
    runPackagedClient.main = runClient.main
    runPackagedClient.args = runClient.args
    runPackagedClient.classpath = files(runClient.classpath.filter { dependency ->
        dependency.canonicalFile != developmentOutput &&
                !shadedDependencies.contains(dependency.canonicalFile)
    })
    runPackagedClient.workingDir file("$buildDir/packagedRun")
    runPackagedClient.outputs.upToDateWhen { false }
}

// The legacy IDEA generator hardcodes its VM options instead of reading the
// JavaExec tasks, so add the same coremod property to Minecraft Client.
ideaWorkspace.doLast {
    File workspace = file("${project.name}.iws")
    if (workspace.exists()) {
        String original = '<option name="VM_PARAMETERS" value="-Xincgc -Xmx1024M -Xms1024M"/>'
        String patched = '<option name="VM_PARAMETERS" value="-Xincgc -Xmx1024M -Xms1024M -Dfml.coreMods.load=com.zergatul.freecam.FMLTweaker"/>'
        workspace.text = workspace.text.replace(original, patched)
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", "1.7.10"

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.7.10'
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
