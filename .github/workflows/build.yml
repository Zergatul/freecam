name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@main

      - name: Setup Java
        uses: actions/setup-java@main
        with:
          distribution: temurin
          java-version: 8

      - name: Build
        run: |
          cd forge
          ./gradlew build

      - name: Upload Artifacts
        uses: actions/upload-artifact@main
        with:
          name: forge
          path: forge/build/libs/*.jar
          compression-level: 0
          if-no-files-found: error