name: Build

on:
  push:
    branches-ignore: 'archive/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt'
          java-version: '21'

      - name: Permissions to Run gradlew
        run: |
          chmod +x ./annotation-processor/gradlew
          chmod +x ./fabric/gradlew
          chmod +x ./forge/gradlew
          chmod +x ./neoforge/gradlew

      - name: Build Fabric
        run: |
          cd fabric
          ./gradlew build
          cd ..

      - name: Build Forge
        run: |
          cd forge
          ./gradlew build
          cd ..

      - name: Build NeoForge
        run: |
          cd neoforge
          ./gradlew build
          cd ..

      - name: Upload fabric artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fabric
          path: fabric/build/libs/*.jar
          compression-level: 0
          if-no-files-found: error

      - name: Upload forge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge
          path: forge/build/libs/*.jar
          compression-level: 0
          if-no-files-found: error

      - name: Upload neoforge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neoforge
          path: neoforge/build/libs/*.jar
          compression-level: 0
          if-no-files-found: error